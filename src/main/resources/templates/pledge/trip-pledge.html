<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <style>
    @page { size: A4; margin: 13mm 15mm; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: #171717;
      font-family: "NanumGothic", sans-serif;
      font-size: 10pt;
      line-height: 1.5;
    }
    .document-meta {
      border-bottom: 1px solid #cfcfcf;
      color: #555555;
      font-size: 8.5pt;
      padding-bottom: 2.5mm;
      width: 100%;
    }
    .document-meta td:last-child { text-align: right; }
    .title-block { padding: 10mm 0 7mm; text-align: center; }
    .title-block h1 { font-size: 25pt; margin: 0; }
    .title-block p { font-size: 11pt; font-weight: 700; margin: 2mm 0 0; }
    .trip-meta {
      background: #f5f3ef;
      border: 1px solid #ded8cf;
      margin-bottom: 5mm;
      padding: 3mm 5mm;
      text-align: center;
    }
    .trip-title { font-weight: 700; }
    .trip-period { color: #666666; font-size: 8.5pt; margin-top: 1mm; }
    .intro { margin: 0 0 4mm; text-align: center; }
    #pledge-items { counter-reset: pledge-item; list-style: none; margin: 0; padding: 0 5mm; }
    #pledge-items li {
      border-bottom: 1px solid #e1e1e1;
      counter-increment: pledge-item;
      min-height: 7mm;
      padding: 1.4mm 2mm 1.4mm 12mm;
      position: relative;
    }
    #pledge-items li::before {
      content: counter(pledge-item, decimal-leading-zero);
      font-size: 8pt;
      font-weight: 700;
      left: 2mm;
      position: absolute;
      top: 1.8mm;
    }
    .promise { font-weight: 700; margin: 6mm 0 3mm; text-align: center; }
    .written-date { color: #555555; font-size: 9pt; margin-bottom: 4mm; text-align: center; }
    .signature-section { page-break-inside: avoid; text-align: center; }
    .signature-list { text-align: center; width: 100%; }
    .signature-card {
      border: 1px solid #d8d8d8;
      display: inline-block;
      margin: 0 1%;
      min-height: 28mm;
      padding: 2mm;
      text-align: center;
      vertical-align: top;
      width: 30%;
    }
    .signature-role { color: #666666; font-size: 7.5pt; }
    .signature-image-frame { height: 12mm; margin-top: 1mm; text-align: center; }
    .signature-image { height: 11mm; max-width: 100%; }
    .signature-name { font-size: 8.5pt; font-weight: 700; }
    .signature-stamp {
      border: 1.5px solid #b22a2a;
      color: #b22a2a;
      font-size: 6.5pt;
      font-weight: 700;
      margin: 1mm auto 0;
      padding: 0.5mm 1mm;
      width: 17mm;
    }
    .footer { color: #999999; font-size: 7pt; margin-top: 5mm; text-align: center; }
  </style>
</head>
<body>
  <main>
    <table class="document-meta">
      <tr>
        <td>계약 제<span id="document-number">2026-01</span>호</td>
        <td>작성일 <span id="written-date">2026.08.11</span></td>
      </tr>
    </table>

    <header class="title-block">
      <h1>서약서</h1>
      <p>- <span id="document-title">우리 가족 여행 10계명</span> -</p>
    </header>

    <section class="trip-meta">
      <div id="trip-title" class="trip-title">여행 제목</div>
      <div id="trip-period" class="trip-period">여행 기간</div>
    </section>

    <p class="intro">우리 가족은 즐거운 가족 여행을 위하여 아래 금지어 사용을 최대한 자제할 것을 약속합니다.</p>
    <ol id="pledge-items"></ol>
    <p class="promise">위 내용을 모두 확인했으며 여행 중 서로를 배려할 것을 약속합니다.</p>
    <div class="written-date">작성일 <span id="written-date-copy">2026.08.11</span></div>

    <section class="signature-section">
      <div id="signature-list" class="signature-list"></div>
    </section>

    <footer class="footer">모셔용 · 우리 가족 여행 10계명</footer>
  </main>
</body>
</html>
