<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <style>
    @page {
      size: 374px 886px;
      margin: 0;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 886px;
      margin: 0;
      width: 374px;
    }

    body {
      background: #ffffff;
      color: #151717;
      font-family: "Pretendard", sans-serif;
      font-size: 13px;
      line-height: 1.65;
    }

    .document {
      height: 886px;
      padding: 36px 33px 35px;
      position: relative;
      width: 374px;
    }

    .document-meta {
      color: #969b9b;
      font-size: 10px;
      line-height: 14px;
      width: 100%;
    }

    .document-meta td {
      padding: 0;
    }

    .document-meta td:last-child {
      text-align: right;
    }

    .title-block {
      padding-top: 25px;
      text-align: center;
    }

    .title-block h1 {
      font-size: 18px;
      font-weight: 600;
      line-height: 25px;
      margin: 0;
    }

    .title-block p {
      color: #9a9f9f;
      font-size: 12px;
      font-weight: 400;
      line-height: 18px;
      margin: 5px 0 0;
    }

    .title-rule {
      border-top: 2px solid #8e9998;
      height: 2px;
      margin: 20px auto 0;
      width: 40px;
    }

    .intro {
      font-size: 13px;
      font-weight: 400;
      line-height: 23px;
      margin: 22px 0 14px;
      text-align: center;
    }

    #pledge-items {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    #pledge-items li {
      border-bottom: 1px solid #eceeee;
      height: 47px;
      line-height: 46px;
      overflow: hidden;
      white-space: nowrap;
    }

    .item-order {
      color: #6f7777;
      display: inline-block;
      font-size: 12px;
      font-weight: 400;
      width: 40px;
    }

    .item-content {
      display: inline-block;
      font-size: 13px;
      font-weight: 600;
      max-width: 264px;
      vertical-align: top;
    }

    #completion-stamp {
      border: 2px solid #ef654f;
      border-radius: 50%;
      bottom: 147px;
      color: #ef654f;
      font-size: 17px;
      font-weight: 600;
      height: 69px;
      line-height: 22px;
      padding-top: 10px;
      position: absolute;
      right: 39px;
      text-align: center;
      width: 69px;
    }

    .completion-stamp-inner {
      border: 1px solid #ef654f;
      border-radius: 50%;
      height: 59px;
      margin: -7px auto 0;
      padding-top: 7px;
      width: 59px;
    }

    .written-date {
      bottom: 126px;
      font-size: 13px;
      left: 0;
      line-height: 20px;
      position: absolute;
      text-align: center;
      width: 100%;
    }

    .signature-section {
      bottom: 36px;
      left: 33px;
      position: absolute;
      width: 308px;
    }

    .signature-list {
      text-align: center;
      width: 100%;
    }

    .signature-group {
      display: inline-block;
      margin: 0;
      text-align: left;
      vertical-align: top;
      width: 46.4%;
    }

    .signature-group + .signature-group {
      margin-left: 7.1%;
    }

    .signature-owner {
      height: 18px;
      line-height: 18px;
      overflow: hidden;
      text-align: center;
      white-space: nowrap;
    }

    .signature-role {
      color: #a5aaaa;
      font-size: 10px;
      font-weight: 400;
      margin-right: 10px;
    }

    .signature-name {
      color: #151717;
      font-size: 13px;
      font-weight: 600;
    }

    .signature-frames {
      font-size: 0;
      margin-top: 8px;
      white-space: nowrap;
    }

    .signature-image-frame {
      border: 1px dashed #dfe3e3;
      border-radius: 8px;
      height: 56px;
      display: inline-block;
      line-height: 54px;
      overflow: hidden;
      text-align: center;
      vertical-align: top;
      width: 100%;
    }

    .signature-frame-count-2 .signature-image-frame {
      width: 50%;
    }

    .signature-frame-count-2 .signature-image-frame:first-child {
      border-bottom-right-radius: 0;
      border-right: 0;
      border-top-right-radius: 0;
    }

    .signature-frame-count-2 .signature-image-frame + .signature-image-frame {
      border-bottom-left-radius: 0;
      border-top-left-radius: 0;
    }

    .signature-frame-count-2 .signature-image {
      height: auto;
      max-height: 50px;
      width: 96%;
    }

    .signature-image {
      height: 50px;
      max-width: 96%;
      vertical-align: middle;
    }

    .signature-placeholder {
      color: #b6bbbb;
      font-size: 10px;
      vertical-align: middle;
    }
  </style>
</head>
<body>
  <main class="document">
    <table class="document-meta">
      <tr>
        <td>계약 제<span id="document-number">2026-01</span>호</td>
        <td>작성일 <span id="written-date">2026. 08. 11</span></td>
      </tr>
    </table>

    <header class="title-block">
      <h1>서 약 서</h1>
      <p>- 우리 <span id="document-title">가족 여행 10계명</span> -</p>
      <div class="title-rule"></div>
    </header>

    <p class="intro">우리 가족은 즐거운 가족 여행을 위하여<br />아래 금지어 사용을 최대한 자제할 것을 약속합니다.</p>
    <ol id="pledge-items"></ol>

    <div id="completion-stamp" class="completion-stamp">
      <div class="completion-stamp-inner">서 약<br />완 료</div>
    </div>

    <div id="written-date-copy" class="written-date">2026년 8월 11일</div>

    <section class="signature-section">
      <div id="signature-list" class="signature-list"></div>
    </section>
  </main>
</body>
</html>
