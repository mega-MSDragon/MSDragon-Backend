spring:
  application:
    name: backend

app:
  auth:
    jwt:
      issuer: msdragon
      secret: ${APP_AUTH_JWT_SECRET:local-dev-secret-for-msdragon-auth-token-must-be-over-32-bytes}
      access-token-expiration: ${APP_AUTH_ACCESS_TOKEN_EXPIRATION:P365D}
      refresh-token-expiration: P14D
      signup-token-expiration: PT30M
    oauth:
      kakao:
        user-info-uri: https://kapi.kakao.com/v2/user/me
      apple:
        issuer: https://appleid.apple.com
        jwks-uri: https://appleid.apple.com/auth/keys
        client-id: ${APP_AUTH_APPLE_CLIENT_ID:}
  tour-api:
    base-uri: https://apis.data.go.kr/B551011/KorWithService2
    general-base-uri: https://apis.data.go.kr/B551011/KorService2
    service-key: ${TOUR_API_SERVICE_KEY:}
    mobile-os: ETC
    mobile-app: ${TOUR_API_MOBILE_APP:MSDragon}
    connect-timeout: ${TOUR_API_CONNECT_TIMEOUT:PT5S}
    request-timeout: ${TOUR_API_REQUEST_TIMEOUT:PT10S}
  tmap:
    base-uri: https://apis.openapi.sk.com/tmap
    app-key: ${TMAP_APP_KEY:}
    search-option: ${TMAP_SEARCH_OPTION:0}
    car-type: ${TMAP_CAR_TYPE:1}
    default-start-time: "${TMAP_DEFAULT_START_TIME:10:00}"
    connect-timeout: ${TMAP_CONNECT_TIMEOUT:PT5S}
    request-timeout: ${TMAP_REQUEST_TIMEOUT:PT15S}
  openai:
    base-uri: https://api.openai.com/v1
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-5.6-luna}
    connect-timeout: ${OPENAI_CONNECT_TIMEOUT:PT5S}
    request-timeout: ${OPENAI_REQUEST_TIMEOUT:PT30S}
    max-output-tokens: ${OPENAI_MAX_OUTPUT_TOKENS:800}
