services:
  postgres:
    image: postgres:17-alpine
    container_name: msdragon-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  app:
    build:
      context: .
    container_name: msdragon-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
      APP_AUTH_JWT_SECRET: ${APP_AUTH_JWT_SECRET:?APP_AUTH_JWT_SECRET is required}
      APP_AUTH_ACCESS_TOKEN_EXPIRATION: ${APP_AUTH_ACCESS_TOKEN_EXPIRATION:-P365D}
      APP_AUTH_APPLE_CLIENT_ID: ${APP_AUTH_APPLE_CLIENT_ID:?APP_AUTH_APPLE_CLIENT_ID is required}
      APP_AUTH_APPLE_TEAM_ID: ${APP_AUTH_APPLE_TEAM_ID:-}
      APP_AUTH_APPLE_KEY_ID: ${APP_AUTH_APPLE_KEY_ID:-}
      APP_AUTH_APPLE_PRIVATE_KEY: ${APP_AUTH_APPLE_PRIVATE_KEY:-}
      APP_AUTH_KAKAO_ADMIN_KEY: ${APP_AUTH_KAKAO_ADMIN_KEY:-}
      APP_AUTH_OAUTH_REQUEST_TIMEOUT: ${APP_AUTH_OAUTH_REQUEST_TIMEOUT:-PT5S}
      APP_REVIEW_FAMILY_CODE: ${APP_REVIEW_FAMILY_CODE:-}
      TOUR_API_SERVICE_KEY: ${TOUR_API_SERVICE_KEY:-}
      TOUR_API_MOBILE_APP: ${TOUR_API_MOBILE_APP:-MSDragon}
      TOUR_API_CONNECT_TIMEOUT: ${TOUR_API_CONNECT_TIMEOUT:-PT5S}
      TOUR_API_REQUEST_TIMEOUT: ${TOUR_API_REQUEST_TIMEOUT:-PT10S}
      TMAP_APP_KEY: ${TMAP_APP_KEY:-}
      TMAP_SEARCH_OPTION: ${TMAP_SEARCH_OPTION:-0}
      TMAP_CAR_TYPE: ${TMAP_CAR_TYPE:-1}
      TMAP_DEFAULT_START_TIME: ${TMAP_DEFAULT_START_TIME:-10:00}
      TMAP_CONNECT_TIMEOUT: ${TMAP_CONNECT_TIMEOUT:-PT5S}
      TMAP_REQUEST_TIMEOUT: ${TMAP_REQUEST_TIMEOUT:-PT15S}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
      OPENAI_CONNECT_TIMEOUT: ${OPENAI_CONNECT_TIMEOUT:-PT5S}
      OPENAI_REQUEST_TIMEOUT: ${OPENAI_REQUEST_TIMEOUT:-PT30S}
      OPENAI_MAX_OUTPUT_TOKENS: ${OPENAI_MAX_OUTPUT_TOKENS:-800}
    networks:
      - backend

  nginx:
    image: nginx:1.27-alpine
    container_name: msdragon-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
    networks:
      - backend

volumes:
  postgres-data:

networks:
  backend:
