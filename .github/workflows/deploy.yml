name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: ./gradlew test

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          test -n "$EC2_HOST"
          test -n "$EC2_USER"
          test -n "$EC2_SSH_KEY"

          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/msdragon_ec2
          chmod 600 ~/.ssh/msdragon_ec2
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

          if [ -z "$DEPLOY_PATH" ]; then
            DEPLOY_PATH="/opt/MSDragon-Backend"
          fi

          ssh -i ~/.ssh/msdragon_ec2 "$EC2_USER@$EC2_HOST" "DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'EOF'
          set -euo pipefail

          cd "$DEPLOY_PATH"
          git fetch origin main
          git reset --hard origin/main

          if [ ! -f .env ]; then
            echo ".env file is missing in $DEPLOY_PATH" >&2
            echo "Create it from .env.example before deploying." >&2
            exit 1
          fi

          docker compose up -d --build
          docker image prune -f
          EOF
